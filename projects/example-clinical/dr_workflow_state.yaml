workflow: dr
state_version: 2
project_name: "example-clinical"
workflow_track: "medical"
research_question: "Does treatment arm affect 30-day mortality, adjusted for baseline clinical risk factors? (assumed -- see plans/sap.md Section A)"

# This state file was stuck at its fresh-project template (everything
# not_started, research_question blank) even though scripts/desc.R,
# scripts/infer.R, and outputs_synthetic/ already existed and were complete.
# Corrected here to match reality as part of backfilling the Phase 0
# pre-registration gate (tools/sap_gate). plans/analysis_plan.yaml and
# plans/sap.md are themselves backfilled from script content, not from a
# recorded user-confirmation trail -- weaker provenance than crp-mortality or
# burnout-mediation. See plans/sap.md's top-of-document note.
analysis_mode: "all_steps"
sap_approved: false

# Stage map:
#   A: pattern_extract.R written and run locally -> pattern/dataset_pattern.csv (user-reviewed)
#   B: scripts/synthesize_data.R written by the agent
#   C: user runs it locally -> data_synthetic/synthetic_dataset.csv
#   D1: analysis_plan.yaml            (dr-01)
#   D1b: plans/sap.md                 (dr-01b)
#   D2: scripts/desc.R                (dr-02)
#   D3: scripts/infer.R crude         (dr-03)  | sem track: scripts/sem_measurement.R (dr-sem-01)
#   D4: scripts/infer.R adjusted      (dr-04)  | sem track: scripts/sem_structural.R  (dr-sem-02)
#   E: user runs scripts on real data in RStudio, pastes output -> dr-05 writes final results
current_stage: "D4"

stage_status:
  A_pattern_extracted: "complete"
  B_synthesis_code_written: "complete"
  C_synthetic_created: "complete"
  D1_analysis_plan: "needs_review"            # backfilled; several roles inferred, not confirmed
  D1b_sap: "backfilled_pending_user_review"   # plans/sap.md exists; awaits user approval
  D2_descriptive_code: "complete"
