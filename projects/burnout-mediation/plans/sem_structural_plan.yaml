dr_step: D4_sem
plan_version: 2

inputs:
  analysis_plan: "plans/analysis_plan.yaml"
  sem_measurement_plan: "plans/sem_measurement_plan.yaml"
  synthetic_dataset: "data_synthetic/synthetic_dataset.csv"

link_to_d3:
  measurement_model_unchanged: true
  constructs_used:
    - "Job_Satisfaction"
    - "Burnout"

structural_model:
  outcome: "turnover_intent"
  paths:
    - from: "Job_Satisfaction"
      to: "Burnout"
      rationale: "JS giảm → Burnout tăng (hypothesis a path)"
    - from: "Burnout"
      to: "turnover_intent"
      rationale: "Burnout tăng → turnover intent tăng (hypothesis b path)"
    - from: "Job_Satisfaction"
      to: "turnover_intent"
      rationale: "Direct effect JS → turnover_intent (c' path)"
  covariates_observed:
    - "age"
    - "gender"
    - "education"
    - "tenure_years"
  dummy_coding:
    - variable: "gender"
      coding: "0 = Nữ, 1 = Nam"
    - variable: "education"
      coding: "THPT (reference), education_dh = Đại học, education_ts = Thạc sĩ, education_tien = Tiến sĩ"
  lavaan_syntax: |
    # Measurement
    Job_Satisfaction =~ js_q1 + js_q2 + js_q3 + js_q4 + js_q5
    Burnout          =~ bo_q1 + bo_q2 + bo_q3 + bo_q4 + bo_q5

    # Structural
    Burnout ~ a * Job_Satisfaction + age + gender_num + education_dh + education_ts + education_tien + tenure_years
    turnover_intent ~ c_prime * Job_Satisfaction + b * Burnout + age + gender_num + education_dh + education_ts + education_tien + tenure_years

    # Indirect and total effects
    indirect := a * b
    total := c_prime + (a * b)

reporting:
  fit_indices: ["cfi", "tli", "rmsea", "srmr"]
  estimates: "unstandardized + standardized, 95% CI, p-value"
  r_squared: true
  causal_language_allowed: false

script:
  file: "scripts/sem_structural.R"
  verified_on_synthetic: false

user_confirmation:
  status: "confirmed"
  notes: "All paths confirmed by user."

readiness:
  status: "ready"
  blocking_issues: []
  review_issues:
    - "turnover_intent is binary; ML estimator may produce biased SEs; DWLS/ordered option noted as extension"
  assumptions:
    - "Items treated as continuous (ML estimator)"
    - "Mediation paths as specified"

next_step:
  skill: "dr-05-present-results"
