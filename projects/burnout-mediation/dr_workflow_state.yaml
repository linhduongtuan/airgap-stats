workflow: dr
state_version: 2
project_name: "burnout-mediation"
workflow_track: "sem"
research_question: "Burnout có làm trung gian mối quan hệ giữa job satisfaction và ý định nghỉ việc không?"

# This worked example was completed before Stage D1b existed. plans/sap.md was
# backfilled from the already-confirmed D1/D3/D4 decisions as part of rolling out
# the Phase 0 pre-registration gate (tools/sap_gate) -- it still needs the user's
# explicit read-through and approval before sap_approved flips to true; a
# backfilled document is not the same guarantee as a blind prospective SAP.
analysis_mode: "all_steps"
sap_approved: false

# Stage map:
#   A: pattern_extract.R written and run locally -> pattern/dataset_pattern.csv (user-reviewed)
#   B: scripts/synthesize_data.R written by the agent
#   C: user runs it locally -> data_synthetic/synthetic_dataset.csv
#   D1: analysis_plan.yaml            (dr-01)
#   D2: scripts/desc.R                (dr-02)
#   D2b: scripts/plots.R              (dr-02b) OPTIONAL, non-blocking
#   D3: scripts/sem_measurement.R     (dr-sem-01)
#   D4: scripts/sem_structural.R      (dr-sem-02)
#   E: user runs scripts on real data in RStudio, pastes output -> dr-05 writes final results
current_stage: "E"

stage_status:
  A_pattern_extracted: "complete"
  B_synthesis_code_written: "complete"
  C_synthetic_created: "complete"
  D1_analysis_plan: "complete"
  D1b_sap: "backfilled_pending_user_review"   # plans/sap.md exists; awaits user approval
  D2_descriptive_code: "complete"
  D2b_visual_exploration: "complete"
  D3_main_analysis_code: "complete"
  D4_full_model_code: "complete"
  E_real_results: "complete"

artifacts:
  dataset_pattern: "pattern/dataset_pattern.csv"
  pattern_reviewed_by_user: true
  sap: "plans/sap.md"
  synthesize_script: "scripts/synthesize_data.R"
  synthetic_dataset: "data_synthetic/synthetic_dataset.csv"
  analysis_plan: "plans/analysis_plan.yaml"
  desc_script: "scripts/desc.R"
  plots_script: "scripts/plots.R"
  infer_script: null
  sem_measurement_script: "scripts/sem_measurement.R"
  sem_structural_script: "scripts/sem_structural.R"
  rstudio_output_received: true
  present_results: "results_real/present_results.md"

verified_by:
  desc_script: "agent"           # Rscript, exit 0, synthetic
  plots_script: "agent"          # Rscript, exit 0, figures visually checked
  infer_script: null
  # Verified with R 4.5.2 (the install that carries lavaan); R 4.6.1 on the
  # same machine does not have it. Both exit 0 on synthetic data.
  sem_measurement_script: "agent"
  sem_structural_script: "agent"

next_action:
  skill: "none"
  reason: "All stages (A-E) complete. plans/sap.md was backfilled and needs the user's review/approval (sap_approved: false); run `python -m tools.sap_gate projects/burnout-mediation` to check it mechanically first."
  user_prompt: "Please review plans/sap.md, especially Section K's estimator disagreement (ML vs WLSMV/DWLS, still unresolved), then confirm to set sap_approved: true."
