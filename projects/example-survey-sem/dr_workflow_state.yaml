  plots_script: null
  infer_script: null
  sem_measurement_script: "agent"  # scripts/sem_measurement.py run directly, exit 0, synthetic
  sem_structural_script: "agent"   # scripts/sem_structural.py run directly, exit 0, synthetic

next_action:
  skill: "dr-01b-analysis-sap"
  reason: "plans/analysis_plan.yaml and plans/sap.md were both backfilled from existing code, not confirmed by a user. Run `python -m tools.sap_gate projects/example-survey-sem` first, then have the user review and confirm the flagged assumed/needs_review items before treating this project as more than a worked demo."
  user_prompt: "Please review plans/sap.md (especially Section C's variable roles and Section K's estimator flag), confirm or correct them, then confirm to set sap_approved: true."
